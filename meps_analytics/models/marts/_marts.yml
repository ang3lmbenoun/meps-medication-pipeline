version: 2

models:
  - name: dim_person
    description: "Person dimension (MEPS 2021): one row per surveyed person."
    columns:
      - name: person_id
        tests: [not_null, unique]
      - name: sex
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female']

  - name: fct_prescriptions
    description: "Prescription-fill fact (MEPS 2021): one row per fill, mental-health flagged."
    columns:
      - name: person_id
        description: "Foreign key to dim_person."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id
      - name: is_mental_health
        tests: [not_null]